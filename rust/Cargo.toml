[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Databricks Shopping Sessions pipeline (Rust port of the C++ entry)"
publish = false

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[features]
collide = []  # tests: few long-ID key bits, so long IDs collide
probe = []    # analysis: SHOPPING_PROBE=read|scan|fields|keys stops the parse early
# x86 bench variants, each an earlier choice: 64-byte scanner blocks, an
# 8-line parse delay, 64k-line dedup buckets, no linked-ID filter
scan64 = []
pd8 = []
bigdd = []
nofilter = []
