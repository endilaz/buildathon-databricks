# x86 benchmark of this branch against the competitor's public repo on a
# GitHub-hosted runner. Results are pushed to the bench-results branch.
name: x86 bench
on:
  push:
    branches: [bench-ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build this branch's image
        run: |
          docker build -q -t ours .
          cid=$(docker create ours) && docker cp $cid:/shopping-sessions ./ours && docker rm $cid
      - name: Build an unstripped copy for profiling, and the sweep variants
        run: |
          F="-O3 -DNDEBUG -flto=auto -fno-plt"
          A="-march=x86-64-v3 -mtune=cascadelake"
          make -s CXX=g++ ARCHFLAGS="$A" CXXFLAGS="$F -g -fno-omit-frame-pointer" LDFLAGS=-static BIN=ours-g
          for v in "pd8:-DSS_PD=8" "pd12:-DSS_PD=12" "pd16:-DSS_PD=16" "pd24:-DSS_PD=24" \
                   "pb1k:-DSS_PD=12 -DSS_PBE=32768" "pb2k:-DSS_PD=12 -DSS_PBE=16384"; do
            make -s -B CXX=g++ ARCHFLAGS="$A" CXXFLAGS="$F ${v#*:}" LDFLAGS=-static BIN=v-${v%%:*}
          done
      - name: Build the base images (origin/main and the unstaged single scatter)
        run: |
          for c in 0e598b9; do
            git worktree add -q wt-$c $c
            docker build -q -t img-$c wt-$c
            cid=$(docker create img-$c) && docker cp $cid:/shopping-sessions ./bin-$c && docker rm $cid
          done
      - name: Fetch the data generator (generator only; no other pipeline is built)
        run: git clone -q --depth 1 https://github.com/hansliu-dev/676767 ref
      - name: Generate 20M events
        run: |
          cd ref/pgo/generator && cargo build --release -q
          ./target/release/generate --seed 21 --events 20000000 --clicks 5000000 --output $HOME/data
          du -sh $HOME/data
      - name: Benchmark
        run: bash scripts/ci_bench.sh $HOME/data results.txt
      - name: Publish results
        if: always()
        run: |
          mkdir pub && cp results.txt pub/ 2>/dev/null; cp perf-*.txt pub/ 2>/dev/null; true
          cd pub && git init -q && git checkout -q -b bench-results
          git config user.name github-actions && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -qm "x86 bench results for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" bench-results
