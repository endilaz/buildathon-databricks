# x86 benchmark of the Rust candidate on this branch against the submitted
# build (origin/main), its feature variants and the C++ build, on 20M events
# from the official generator. Results are pushed to the bench-results branch.
name: x86 bench
on:
  push:
    branches: [bench-ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the candidate image, the submitted main and the C++ build
        run: |
          docker build -q -t cand .
          cid=$(docker create cand) && docker cp $cid:/shopping-sessions ./cand && docker rm $cid
          git worktree add -q wt-main origin/main
          docker build -q -t subm wt-main
          cid=$(docker create subm) && docker cp $cid:/shopping-sessions ./subm && docker rm $cid
          docker build -q -f Dockerfile.cpp -t cpp .
          cid=$(docker create cpp) && docker cp $cid:/shopping-sessions ./cpp && docker rm $cid
          docker build -q -f wt-main/Dockerfile.cpp -t cppold wt-main
          cid=$(docker create cppold) && docker cp $cid:/shopping-sessions ./cppold && docker rm $cid
      - name: Build the feature variants (host toolchain) and a profiling copy
        run: |
          cd rust
          rustc --version | tee ../rustc.txt
          T=x86_64-unknown-linux-gnu
          F="-C target-cpu=x86-64-v3 -C target-feature=+crt-static"
          RUSTFLAGS="$F" cargo build -q --release --offline --target $T && cp target/$T/release/shopping-sessions ../v-base
          for f in stage1 nofilter pd12; do
            RUSTFLAGS="$F" cargo build -q --release --offline --features $f --target $T
            cp target/$T/release/shopping-sessions ../v-$f
          done
          CARGO_PROFILE_RELEASE_STRIP=false CARGO_PROFILE_RELEASE_DEBUG=line-tables-only \
            RUSTFLAGS="$F -C force-frame-pointers=yes" cargo build -q --release --offline --target $T
          cp target/$T/release/shopping-sessions ../cand-g
      - name: Build an unstripped C++ copy for profiling
        run: |
          sudo apt-get install -y -qq g++ make > /dev/null 2>&1 || true
          make -s -C wt-main CXX=g++ ARCHFLAGS="-march=x86-64-v3 -mtune=cascadelake" CXXFLAGS="-O3 -DNDEBUG -flto=auto -fno-plt -g -fno-omit-frame-pointer" LDFLAGS=-static BIN=cpp-g
          cp wt-main/cpp-g ./cpp-g
      - name: Generate 20M events with the official generator
        run: |
          curl -fsSL -o gen.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          mkdir gen && unzip -q gen.zip -d gen
          cd "$(dirname "$(find gen -name Cargo.toml | head -1)")" && cargo build --release -q
          ./target/release/generate --seed 21 --events 20000000 --clicks 5000000 --output $HOME/data
          du -sh $HOME/data
      - name: Benchmark
        run: bash scripts/ci_bench.sh $HOME/data results.txt
      - name: Publish results
        if: always()
        run: |
          mkdir pub && cp results.txt pub/ 2>/dev/null; cp perf-*.txt pub/ 2>/dev/null; true
          cd pub && git init -q && git checkout -q -b bench-results
          git config user.name github-actions && git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -qm "x86 bench results for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" bench-results
